version: "3.9"
services:
  hackathon:
    build:
      context: ./
      dockerfile: Dockerfile
    depends_on:
      - database
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    networks:
      - backend-network
      - hackathon-network

  database:
    image: postgres:16  # <--- ИЗМЕНЕНО: фиксируем версию вместо latest
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
  hackathon-network:
    driver: bridge
    name: hackathon-network

volumes:
  db_data:
